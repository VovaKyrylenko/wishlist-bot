name: Flows (staging database)

# Manual only. Runs `pnpm run verify:flows` (synthetic Telegram updates, ~94 assertions)
# against a real Postgres. It is NOT part of the required `quality` check because:
#   - it needs a staging DATABASE_URL and this repository has no such secret (yet);
#   - it deletes every row of four tables (harness.ts reset()), so two runs at once would
#     corrupt each other: hence the single concurrency group below;
#   - a flaky database must not be able to block every merge (ADR 0002).
# Until the secret exists this workflow fails at its first step, on purpose: a run that
# skips quietly would look like a pass. Migrations must already be applied to that database.
# Only harness.ts assertStaging() decides whether a database may be wiped; do not add a second door.
#
# Who may reach the secret: a dispatch runs the workflow file and the code of whatever ref it is
# started on, so any branch could print the secret or skip assertStaging(). A check on
# github.ref written in THIS file would not help, because that branch can edit this file. The
# restriction therefore lives in repository settings: the job uses the `staging` Environment,
# and the owner should create it with "deployment branches: main only" and store
# STAGING_DATABASE_URL there instead of as a repository secret. Until then anyone with write
# access can dispatch a branch and read the secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Require the staging secret
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::error::Secret STAGING_DATABASE_URL is not set, so verify:flows cannot run. Nothing was checked."
            exit 1
          fi

      - uses: actions/checkout@v4

      # pnpm first: setup-node can only cache pnpm's store once pnpm exists. The pnpm version is
      # package.json `packageManager`; the Node version is `engines.node` (the field Vercel reads
      # too, so CI and production cannot drift apart).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run flows
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # src/bot.ts throws without it; Telegram is stubbed, so any well-formed value works.
          BOT_TOKEN: "123456:flows-dummy-token"
        run: pnpm run verify:flows
