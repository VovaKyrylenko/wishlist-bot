name: kit release

# Every merge to the default branch becomes a release: version computed from
# conventional commits, tag pushed, notes generated. Squash-merge makes the PR title the
# commit and the commit the release line — which is why PR titles must be conventional.
#
# This project's extension (ADR 0001): after a release, Claude writes a short announcement
# from the release notes and scripts/announce-release.ts posts it to a Telegram channel.
# It needs three repository secrets and does nothing, successfully, until they exist:
#   ANTHROPIC_API_KEY    writes the text
#   ANNOUNCE_BOT_TOKEN   a bot that is an admin of the channel (the product bot works)
#   ANNOUNCE_CHAT_ID     the channel: -100… id or @username
# Optional: ANNOUNCE_MODEL. Set repository variable ANNOUNCE_DRY_RUN=1 to log the text
# instead of posting it.

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute the next version from conventional commits
        id: version
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          range="$last..HEAD"
          first=false
          [ "$last" = "v0.0.0" ] && { range="HEAD"; first=true; }
          echo "first=$first" >> "$GITHUB_OUTPUT"
          count="$(git rev-list --count $range)"
          if [ "$count" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          subjects="$(git log --format=%s $range)"
          bodies="$(git log --format=%B $range)"
          major=0; minor=0
          printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' && major=1
          printf '%s\n' "$bodies"   | grep -q  'BREAKING CHANGE' && major=1
          printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:' && minor=1
          v="${last#v}"; IFS=. read -r a b c <<EOF
          $v
          EOF
          if   [ "$major" -eq 1 ]; then a=$((a+1)); b=0; c=0
          elif [ "$minor" -eq 1 ]; then b=$((b+1)); c=0
          else c=$((c+1)); fi
          echo "tag=v$a.$b.$c" >> "$GITHUB_OUTPUT"
          echo "skip=false"    >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.first != 'true'
        with:
          node-version: 24

      # The first release has the whole history as its notes; announcing that would be
      # noise, so the channel only hears about releases that follow a previous tag.
      - name: Announce
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.first != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANNOUNCE_BOT_TOKEN: ${{ secrets.ANNOUNCE_BOT_TOKEN }}
          ANNOUNCE_CHAT_ID: ${{ secrets.ANNOUNCE_CHAT_ID }}
          ANNOUNCE_MODEL: ${{ vars.ANNOUNCE_MODEL }}
          DRY_RUN: ${{ vars.ANNOUNCE_DRY_RUN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          export TAG="$tag"
          export NOTES="$(gh release view "$tag" --json body --jq .body)"
          node scripts/announce-release.ts
