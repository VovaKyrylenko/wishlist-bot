name: CI

# Обов'язкова перевірка для branch protection на main: типи + лінт + компіляція
# + unit-тести на кожен PR і push у main. Prisma-схема не потребує реального DATABASE_URL
# для `generate` (лише для migrate/runtime), тому CI не має жодних секретів.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm first: setup-node can only cache pnpm's store once pnpm exists. The pnpm version is
      # package.json `packageManager`; the Node version is `engines.node` (the field Vercel reads
      # too, so CI and production cannot drift apart).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Unit tests plus the per-file coverage floors from vitest.config.ts.
      # `pnpm test` is also what the pre-push hook runs (TEST_UNIT), so local and CI agree.
      #
      # NOT checked here: `pnpm run verify:flows` (about 94 end-to-end assertions). It needs a
      # staging DATABASE_URL and wipes four tables, and this repository has no such secret;
      # this job has none by design (ADR 0002). Owner/co-author gating, surprise mode and
      # every promise/reservation state change are therefore guarded only by that script:
      # run it locally before merging anything under src/features/, api/ or prisma/, or
      # dispatch .github/workflows/flows.yml once the secret exists.
      - name: Unit tests
        run: pnpm test
