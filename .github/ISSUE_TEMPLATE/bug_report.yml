name: 🐛 Щось не працює
description: Бот поводиться не так, як має
labels: ["bug", "triage"]
# Fields about what a person pressed or saw use the bot's own words (see
# .claude/rules/voice.md). The environment field is for maintainers and may keep
# technical terms.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Що сталося
      description: Опиши коротко й по суті.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Очікувана поведінка
      description: Що мало статися замість цього.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Кроки для відтворення
      placeholder: |
        1. Натиснув «➕ Створити список»
        2. Ввів назву …
        3. Побачив помилку …
    validations:
      required: false

  - type: dropdown
    id: role
    attributes:
      label: Хто ти в цій історії
      options:
        - Власник списку
        - Гість (відкрив список друга)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Середовище
      options:
        - Продакшн (вебхук на Vercel)
        - Локально (long polling)
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Скріншоти, логи чи додатковий контекст
    validations:
      required: false
