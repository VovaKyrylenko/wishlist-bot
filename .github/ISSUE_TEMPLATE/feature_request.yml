name: ✨ Ідея чи покращення
description: Ідея нової можливості чи покращення
labels: ["enhancement", "triage"]
# Same register rule as the bug form: the area list uses the bot's own words, except
# the infrastructure entry, which is for maintainers.
body:
  - type: textarea
    id: problem
    attributes:
      label: Яку проблему це вирішує
      description: Що зараз незручно, неможливо чи відсутнє.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Пропоноване рішення
      description: Як, на твою думку, це має працювати.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Частина бота
      options:
        - Створення й налаштування списку
        - Подарунки (додавання, зміна)
        - Я подарую (обіцянки)
        - Список друга (погляд гостя)
        - Стежити й сповіщення
        - Інфраструктура й деплой
        - Інше
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Додатковий контекст
    validations:
      required: false
